# QUOI     — le site Netlify du Hub (`rdc-hub-v2`), qui sert hub.runesdechene.com depuis le 16/10/2026.
# POURQUOI — une appli d'une page : toute adresse sert index.html, le routeur fait le reste. Les
#            fonctions (Shopify, compte du stand) sont celles de l'ancien Hub, déménagées.
[build]
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@supabase/supabase-js"]

[functions."shopify-sync"]
  timeout = 60

# Un réveil rend et envoie un lot de Missives (250) : il lui faut plus que les 10 s par défaut.
[functions."missives-envoyer"]
  timeout = 60

[functions."shopify-callback"]
  timeout = 15

[functions."shopify-proxy"]
  timeout = 15

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
