name: SEO Nightly Build
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # La version de pnpm vient de package.json (packageManager) : la répéter ici fait échouer
      # l'installation dès qu'elles divergent (toutes les nuits du 07 au 11/10/2026).
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --filter @runes/seo-pages

      - name: Generate slugs
        run: pnpm --filter @runes/seo-pages generate:slugs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Generate SEO descriptions
        run: pnpm --filter @runes/seo-pages generate:seo
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Build static pages
        run: pnpm --filter @runes/seo-pages build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Deploy to Netlify
        working-directory: apps/seo-pages
        # --dir DOIT être absolu ($PWD/dist), sinon netlify-cli le résout depuis
        # la racine du repo → "deploy directory not found". Cf. seo-pages/CLAUDE.md.
        run: npx netlify-cli@23.15.1 deploy --prod --no-build --dir="$PWD/dist" --site=5a5b9cb9-d330-41d7-a037-6bd65ac67eb9
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

      # Le Hub lit cette date dans « La santé » (spec Hub V2 §9) : sans elle, une nuit ratée ne se voit nulle part.
      - name: Note the rebuild for the Hub
        run: |
          curl -sf -X POST "$SUPABASE_URL/rest/v1/app_settings?on_conflict=key" \
            -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" -H "Prefer: resolution=merge-duplicates" \
            -d "{\"key\":\"fiches_publiques_le\",\"value\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
