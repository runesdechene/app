name: TLS Cert Expiry Check

# Filet de sécurité : les certs Let's Encrypt de app. et hub. avaient échoué
# leur auto-renouvellement (incident 2026-05). Ce job vérifie chaque lundi que
# les certs servis sont valides ET expirent dans > 21 jours. En cas de problème,
# le run échoue → GitHub notifie les admins du repo par email.

on:
  schedule:
    - cron: '0 8 * * 1'   # tous les lundis 08:00 UTC
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check app. + hub. TLS certs
        run: |
          THRESHOLD_DAYS=21
          fail=0
          for host in app.runesdechene.com hub.runesdechene.com; do
            # 1. Handshake TLS valide ? (attrape expiré / mauvais nom / chaîne cassée)
            if ! curl -sS -o /dev/null --max-time 20 "https://$host"; then
              echo "::error::$host — handshake TLS ÉCHOUÉ (cert invalide, expiré, ou mauvais nom). Renouveler sur Netlify."
              fail=1
              continue
            fi
            # 2. Alerte précoce si expiration proche
            end=$(echo | openssl s_client -connect "$host:443" -servername "$host" 2>/dev/null \
                  | openssl x509 -noout -enddate | cut -d= -f2)
            days=$(( ( $(date -d "$end" +%s) - $(date +%s) ) / 86400 ))
            echo "$host — OK, expire dans $days jour(s) ($end)"
            if [ "$days" -lt "$THRESHOLD_DAYS" ]; then
              echo "::error::$host — cert expire dans $days jours (< $THRESHOLD_DAYS). Renouveler sur Netlify."
              fail=1
            fi
          done
          exit $fail
