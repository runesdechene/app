name: TLS Cert Expiry Check

# Filet de sécurité : les certs Let's Encrypt de app. et hub. avaient échoué
# leur auto-renouvellement (incident 2026-05, hub. expiré 11 jours sans alerte).
# Ce job interroge l'API Netlify chaque lundi et échoue si un cert manque ou
# expire dans < 21 jours → GitHub notifie les admins du repo par email.
#
# On passe par l'API (et non un handshake TLS depuis le runner) car la
# résolution DNS de app./hub. est intermittente sur les clients IPv4-only
# comme les runners GitHub (CNAME o2switch → *.netlify.app, A TTL court).

on:
  schedule:
    - cron: '0 8 * * 1'   # tous les lundis 08:00 UTC
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check app. + hub. cert expiry (Netlify API)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          THRESHOLD_DAYS=21
          fail=0
          check_site () {
            local host="$1" sid="$2"
            local end
            end=$(curl -sS -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
              "https://api.netlify.com/api/v1/sites/$sid/ssl_certificate" \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('expires_at',''))" 2>/dev/null)
            if [ -z "$end" ]; then
              echo "::error::$host — aucun certificat provisionné sur Netlify."
              fail=1; return
            fi
            local days=$(( ( $(date -d "$end" +%s) - $(date +%s) ) / 86400 ))
            echo "$host — expire dans $days jour(s) ($end)"
            if [ "$days" -lt "$THRESHOLD_DAYS" ]; then
              echo "::error::$host — cert expire dans $days jours (< $THRESHOLD_DAYS). Renouveler sur Netlify (Domain management → Renew certificate)."
              fail=1
            fi
          }
          check_site app.runesdechene.com 1b29da09-c7af-44bf-9c31-465bfaae9d74
          check_site hub.runesdechene.com d1cac03c-19a1-4b92-be72-fa3805428cd1
          exit $fail
