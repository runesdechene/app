<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" fill="none">
  <rect width="400" height="260" rx="16" fill="#e8dcc0"/>
  <!-- Carte stylisée en fond -->
  <rect x="30" y="20" width="340" height="220" rx="10" fill="#f5edd8" stroke="#c4a870" stroke-width="1.5"/>
  <!-- Lignes de carte -->
  <path d="M50 100 Q120 80 180 110 Q250 90 350 105" stroke="#d4c4a0" stroke-width="1" fill="none"/>
  <path d="M50 140 Q130 160 200 130 Q280 150 350 135" stroke="#d4c4a0" stroke-width="1" fill="none"/>
  <path d="M100 40 Q110 120 105 220" stroke="#d4c4a0" stroke-width=".8" fill="none"/>
  <path d="M250 40 Q240 100 255 220" stroke="#d4c4a0" stroke-width=".8" fill="none"/>
  <!-- Marqueurs de lieux -->
  <g transform="translate(140,70)">
    <path d="M10 0 C15 0 20 5 20 10 C20 18 10 28 10 28 C10 28 0 18 0 10 C0 5 5 0 10 0Z" fill="#c0392b"/>
    <circle cx="10" cy="10" r="4" fill="#fff"/>
  </g>
  <g transform="translate(230,110)">
    <path d="M10 0 C15 0 20 5 20 10 C20 18 10 28 10 28 C10 28 0 18 0 10 C0 5 5 0 10 0Z" fill="#3a7abf"/>
    <circle cx="10" cy="10" r="4" fill="#fff"/>
  </g>
  <g transform="translate(100,150)">
    <path d="M10 0 C15 0 20 5 20 10 C20 18 10 28 10 28 C10 28 0 18 0 10 C0 5 5 0 10 0Z" fill="#4a8a3e"/>
    <circle cx="10" cy="10" r="4" fill="#fff"/>
  </g>
  <g transform="translate(290,80)">
    <path d="M10 0 C15 0 20 5 20 10 C20 18 10 28 10 28 C10 28 0 18 0 10 C0 5 5 0 10 0Z" fill="#d4a017"/>
    <circle cx="10" cy="10" r="4" fill="#fff"/>
  </g>
  <!-- GPS pulse -->
  <g transform="translate(180,160)">
    <circle cx="12" cy="12" r="18" fill="none" stroke="#3a7abf" stroke-width="1" opacity=".2"/>
    <circle cx="12" cy="12" r="12" fill="none" stroke="#3a7abf" stroke-width="1" opacity=".4"/>
    <circle cx="12" cy="12" r="5" fill="#3a7abf" opacity=".7"/>
  </g>
  <!-- Appareil photo -->
  <g transform="translate(300,170)" opacity=".3">
    <rect x="0" y="6" width="28" height="20" rx="3" fill="#4A3728"/>
    <circle cx="14" cy="16" r="6" fill="none" stroke="#8B6914" stroke-width="1.5"/>
    <rect x="8" y="2" width="12" height="6" rx="2" fill="#4A3728"/>
  </g>
  <!-- Plume -->
  <g transform="translate(50,190) rotate(-30)" opacity=".25">
    <path d="M0 40 Q5 20 3 0 Q8 15 12 40 Q6 35 0 40Z" fill="#4A3728"/>
    <line x1="3" y1="0" x2="6" y2="40" stroke="#8B6914" stroke-width=".5"/>
  </g>
</svg>