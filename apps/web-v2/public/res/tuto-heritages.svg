<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" fill="none">
  <rect width="400" height="260" rx="16" fill="#1e1e2a"/>
  <!-- 4 blasons -->
  <!-- Celtique — vert -->
  <g transform="translate(30,40)">
    <path d="M40 0 L70 15 V55 Q70 80 40 95 Q10 80 10 55 V15Z" fill="#2d5a27" stroke="#4a8a3e" stroke-width="2"/>
    <g transform="translate(25,25)" opacity=".7">
      <circle cx="15" cy="15" r="12" fill="none" stroke="#8fc97a" stroke-width="1.5"/>
      <path d="M15 6 Q20 12 15 18 Q10 12 15 6Z" fill="#8fc97a" opacity=".6"/>
      <line x1="15" y1="18" x2="15" y2="28" stroke="#8fc97a" stroke-width="1"/>
    </g>
    <text x="40" y="110" text-anchor="middle" font-size="11" fill="#8fc97a" font-family="serif">Celte</text>
  </g>
  <!-- Romain — rouge -->
  <g transform="translate(120,40)">
    <path d="M40 0 L70 15 V55 Q70 80 40 95 Q10 80 10 55 V15Z" fill="#6b1a1a" stroke="#c0392b" stroke-width="2"/>
    <g transform="translate(22,22)" opacity=".7">
      <text x="18" y="28" text-anchor="middle" font-size="26" fill="#e8a0a0" font-family="serif">II</text>
    </g>
    <text x="40" y="110" text-anchor="middle" font-size="11" fill="#e8a0a0" font-family="serif">Romain</text>
  </g>
  <!-- Nordique — bleu -->
  <g transform="translate(210,40)">
    <path d="M40 0 L70 15 V55 Q70 80 40 95 Q10 80 10 55 V15Z" fill="#1a3a5a" stroke="#3a7abf" stroke-width="2"/>
    <g transform="translate(26,26)" opacity=".7">
      <path d="M14 0 L14 30 M6 10 L22 20 M22 10 L6 20" stroke="#80b8e8" stroke-width="2" stroke-linecap="round"/>
    </g>
    <text x="40" y="110" text-anchor="middle" font-size="11" fill="#80b8e8" font-family="serif">Nordique</text>
  </g>
  <!-- Byzantin — or -->
  <g transform="translate(300,40)">
    <path d="M40 0 L70 15 V55 Q70 80 40 95 Q10 80 10 55 V15Z" fill="#4a3a1a" stroke="#d4a017" stroke-width="2"/>
    <g transform="translate(24,22)" opacity=".7">
      <circle cx="16" cy="16" r="10" fill="none" stroke="#f0c860" stroke-width="1.5"/>
      <line x1="16" y1="6" x2="16" y2="26" stroke="#f0c860" stroke-width="1.5"/>
      <line x1="6" y1="16" x2="26" y2="16" stroke="#f0c860" stroke-width="1.5"/>
    </g>
    <text x="40" y="110" text-anchor="middle" font-size="11" fill="#f0c860" font-family="serif">Byzantin</text>
  </g>
  <!-- Ligne de connexion entre les 4 -->
  <line x1="70" y1="170" x2="340" y2="170" stroke="#555" stroke-width="1" opacity=".3"/>
  <circle cx="70" cy="170" r="3" fill="#4a8a3e" opacity=".5"/>
  <circle cx="160" cy="170" r="3" fill="#c0392b" opacity=".5"/>
  <circle cx="250" cy="170" r="3" fill="#3a7abf" opacity=".5"/>
  <circle cx="340" cy="170" r="3" fill="#d4a017" opacity=".5"/>
  <!-- Texte central -->
  <text x="200" y="210" text-anchor="middle" font-size="13" fill="#888" font-family="serif" letter-spacing="4">UNE COMMUNAUTE</text>
  <line x1="100" y1="220" x2="300" y2="220" stroke="#555" stroke-width=".5" opacity=".4"/>
</svg>