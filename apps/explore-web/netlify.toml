[build]
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors https://runesdechene.com https://*.runesdechene.com https://*.myshopify.com"

# V2 en construction (apps/web-v2) : même origine que la V1, donc même session.
# Le site V2 publie dist/ à sa racine avec base /v2/ — la redirection retire /v2.
[[redirects]]
  from = "/v2"
  to = "/v2/"
  status = 301
  force = true

[[redirects]]
  from = "/v2/*"
  to = "https://rdc-web-v2.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/lieu/*"
  to = "https://rdc-seo-pages.netlify.app/lieu/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/_astro/*"
  to = "https://rdc-seo-pages.netlify.app/_astro/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "https://rdc-seo-pages.netlify.app/sitemap.xml"
  status = 200
  force = true

[[redirects]]
  from = "/mouvement"
  to = "https://rdc-seo-pages.netlify.app/mouvement"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
