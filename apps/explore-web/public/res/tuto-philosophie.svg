<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" fill="none">
  <!-- Fond parchemin -->
  <rect width="400" height="260" rx="16" fill="#f0e6cc"/>
  <rect x="8" y="8" width="384" height="244" rx="12" fill="none" stroke="#c4a870" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- Livre ouvert -->
  <g transform="translate(120,60)">
    <!-- Page gauche -->
    <path d="M80 0 Q40 5 0 15 V140 Q40 130 80 125Z" fill="#faf3e0" stroke="#b8a47a" stroke-width="1.5"/>
    <!-- Page droite -->
    <path d="M80 0 Q120 5 160 15 V140 Q120 130 80 125Z" fill="#faf3e0" stroke="#b8a47a" stroke-width="1.5"/>
    <!-- Reliure -->
    <line x1="80" y1="0" x2="80" y2="125" stroke="#8B6914" stroke-width="2"/>
    <!-- Lignes de texte gauche -->
    <line x1="18" y1="35" x2="65" y2="30" stroke="#c4a870" stroke-width="1" opacity=".5"/>
    <line x1="18" y1="50" x2="65" y2="45" stroke="#c4a870" stroke-width="1" opacity=".5"/>
    <line x1="18" y1="65" x2="65" y2="60" stroke="#c4a870" stroke-width="1" opacity=".5"/>
    <line x1="18" y1="80" x2="55" y2="75" stroke="#c4a870" stroke-width="1" opacity=".5"/>
    <line x1="18" y1="95" x2="60" y2="92" stroke="#c4a870" stroke-width="1" opacity=".5"/>
    <!-- Lignes de texte droite -->
    <line x1="95" y1="30" x2="142" y2="35" stroke="#c4a870" stroke-width="1" opacity=".5"/>
    <line x1="95" y1="45" x2="142" y2="50" stroke="#c4a870" stroke-width="1" opacity=".5"/>
    <line x1="95" y1="60" x2="142" y2="65" stroke="#c4a870" stroke-width="1" opacity=".5"/>
    <line x1="95" y1="75" x2="135" y2="80" stroke="#c4a870" stroke-width="1" opacity=".5"/>
    <!-- Enluminure -->
    <circle cx="30" cy="28" r="8" fill="#8B6914" opacity=".15"/>
    <text x="26" y="32" font-size="11" fill="#8B6914" font-family="serif" opacity=".6">N</text>
  </g>
  <!-- Feuille de chêne -->
  <g transform="translate(310,180) scale(.8)" opacity=".3">
    <path d="M15 0 C10 8 0 12 2 20 C5 18 8 22 12 20 C10 28 5 32 8 40 C12 36 15 38 15 45 C15 38 18 36 22 40 C25 32 20 28 18 20 C22 22 25 18 28 20 C30 12 20 8 15 0Z" fill="#8B6914"/>
    <line x1="15" y1="5" x2="15" y2="45" stroke="#6b5210" stroke-width="1"/>
  </g>
  <!-- Boussole stylisée -->
  <g transform="translate(40,180)" opacity=".2">
    <circle cx="25" cy="25" r="22" fill="none" stroke="#8B6914" stroke-width="1.5"/>
    <path d="M25 8 L28 22 L25 25 L22 22Z" fill="#8B6914"/>
    <path d="M25 42 L28 28 L25 25 L22 28Z" fill="#c4a870"/>
    <line x1="8" y1="25" x2="42" y2="25" stroke="#c4a870" stroke-width=".5"/>
  </g>
</svg>