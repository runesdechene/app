<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" fill="none">
  <rect width="400" height="260" rx="16" fill="#1a1520"/>
  <!-- Lueur centrale -->
  <radialGradient id="glow" cx="50%" cy="50%">
    <stop offset="0" stop-color="#8B6914" stop-opacity=".15"/>
    <stop offset="1" stop-color="#1a1520" stop-opacity="0"/>
  </radialGradient>
  <rect width="400" height="260" rx="16" fill="url(#glow)"/>
  <!-- Fragment central (gemme) -->
  <g transform="translate(160,60)">
    <path d="M40 0 L70 20 L60 70 L20 70 L10 20Z" fill="#2a2040" stroke="#8B6914" stroke-width="2"/>
    <path d="M40 0 L50 25 L40 65 L30 25Z" fill="#3a2860" opacity=".6"/>
    <path d="M40 0 L70 20 L50 25Z" fill="#4a3870" opacity=".4"/>
    <path d="M40 0 L10 20 L30 25Z" fill="#4a3870" opacity=".3"/>
    <!-- Reflet -->
    <path d="M35 15 L45 15 L42 30 L38 30Z" fill="#8B6914" opacity=".2"/>
  </g>
  <!-- Petits fragments flottants -->
  <g opacity=".4">
    <path d="M60 80 L75 90 L70 110 L55 110 L50 90Z" fill="#2a2040" stroke="#6b5210" stroke-width="1" transform="scale(.5)"/>
  </g>
  <g opacity=".3" transform="translate(310,60) scale(.4)">
    <path d="M40 0 L70 20 L60 70 L20 70 L10 20Z" fill="#2a2040" stroke="#6b5210" stroke-width="1.5"/>
  </g>
  <g opacity=".25" transform="translate(70,140) scale(.35)">
    <path d="M40 0 L70 20 L60 70 L20 70 L10 20Z" fill="#2a2040" stroke="#6b5210" stroke-width="1.5"/>
  </g>
  <g opacity=".2" transform="translate(290,150) scale(.3)">
    <path d="M40 0 L70 20 L60 70 L20 70 L10 20Z" fill="#2a2040" stroke="#6b5210" stroke-width="2"/>
  </g>
  <!-- Particules -->
  <circle cx="120" cy="50" r="1.5" fill="#d4a017" opacity=".5"/>
  <circle cx="280" cy="70" r="1" fill="#d4a017" opacity=".4"/>
  <circle cx="150" cy="180" r="1.2" fill="#d4a017" opacity=".3"/>
  <circle cx="260" cy="190" r="1" fill="#d4a017" opacity=".4"/>
  <circle cx="100" cy="120" r=".8" fill="#d4a017" opacity=".3"/>
  <circle cx="320" cy="130" r="1.3" fill="#d4a017" opacity=".35"/>
  <!-- Texte bonus -->
  <g transform="translate(120,170)">
    <rect x="0" y="0" width="160" height="30" rx="15" fill="#2a2040" stroke="#8B6914" stroke-width="1" opacity=".6"/>
    <text x="80" y="20" text-anchor="middle" font-size="11" fill="#d4a017" font-family="serif" opacity=".7">+ Avantages en jeu</text>
  </g>
  <!-- Vêtement stylisé -->
  <g transform="translate(165,210)" opacity=".2">
    <path d="M20 0 L30 8 L25 12 L28 35 L12 35 L15 12 L10 8Z" fill="#d4a017" stroke="#8B6914" stroke-width="1"/>
  </g>
</svg>