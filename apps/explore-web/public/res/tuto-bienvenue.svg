<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" fill="none">
  <!-- Ciel crépusculaire -->
  <rect width="400" height="260" rx="16" fill="#1a1a2e"/>
  <rect width="400" height="180" rx="16" fill="url(#sky1)"/>
  <defs>
    <linearGradient id="sky1" x1="200" y1="0" x2="200" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2d1b4e"/>
      <stop offset=".5" stop-color="#6b3a5e"/>
      <stop offset="1" stop-color="#c77a3a"/>
    </linearGradient>
  </defs>
  <!-- Soleil -->
  <circle cx="200" cy="155" r="32" fill="#e8a838" opacity=".9"/>
  <circle cx="200" cy="155" r="24" fill="#f0c060"/>
  <!-- Collines -->
  <path d="M0 180 Q60 140 120 165 Q180 130 240 155 Q300 125 360 150 Q400 140 400 180 V260 H0Z" fill="#2a3a25"/>
  <path d="M0 200 Q80 170 160 190 Q240 165 320 185 Q380 170 400 195 V260 H0Z" fill="#1e2d1a"/>
  <!-- Chêne central -->
  <rect x="192" y="170" width="16" height="50" rx="3" fill="#5c3d1e"/>
  <ellipse cx="200" cy="158" rx="42" ry="36" fill="#3a5a2d"/>
  <ellipse cx="188" cy="150" rx="22" ry="20" fill="#4a6e38"/>
  <ellipse cx="215" cy="148" rx="20" ry="18" fill="#3e6230"/>
  <ellipse cx="200" cy="140" rx="18" ry="16" fill="#527a40"/>
  <!-- Étoiles -->
  <circle cx="50" cy="30" r="1.5" fill="#fff" opacity=".8"/>
  <circle cx="120" cy="50" r="1" fill="#fff" opacity=".6"/>
  <circle cx="300" cy="25" r="1.5" fill="#fff" opacity=".7"/>
  <circle cx="350" cy="55" r="1" fill="#fff" opacity=".5"/>
  <circle cx="80" cy="70" r="1" fill="#fff" opacity=".4"/>
  <circle cx="260" cy="40" r="1.2" fill="#fff" opacity=".6"/>
  <!-- Chemin -->
  <path d="M180 260 Q190 230 200 220 Q210 230 220 260" fill="#3a3020" opacity=".5"/>
  <!-- Rune de Chêne (symbole simple) -->
  <g transform="translate(185,85)" opacity=".25">
    <path d="M15 0 L18 10 L28 10 L20 16 L23 26 L15 20 L7 26 L10 16 L2 10 L12 10Z" fill="#f0c060"/>
  </g>
