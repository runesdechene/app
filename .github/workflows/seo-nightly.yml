name: SEO Nightly Build
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --filter @runes/seo-pages

      - name: Generate slugs
        run: pnpm --filter @runes/seo-pages generate:slugs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Generate SEO descriptions
        run: pnpm --filter @runes/seo-pages generate:seo
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Build static pages
        run: pnpm --filter @runes/seo-pages build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Deploy to Netlify
        run: npx netlify-cli deploy --prod --no-build --dir=apps/seo-pages/dist --site=5a5b9cb9-d330-41d7-a037-6bd65ac67eb9
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
