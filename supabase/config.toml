[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323
api_url = "http://localhost"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.external.google]
enabled = false

[auth.external.apple]
enabled = false

[storage]
enabled = true
file_size_limit = "50MiB"

# send-email est appelée par un trigger SQL (pg_net) avec un X-Email-Secret, PAS
# un JWT utilisateur → il faut désactiver la vérif JWT plateforme, sinon 401 avant
# même d'exécuter la fonction (la fonction fait sa propre vérif du secret).
# Un redéploiement CLI SANS --no-verify-jwt réactivait la vérif → emails cassés
# (incident 2026-06-15). Ce bloc verrouille le bon comportement.
[functions.send-email]
verify_jwt = false
